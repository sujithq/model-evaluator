name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=harness.trx" --results-directory artifacts/test-results

      - name: Validate benchmark packages
        run: dotnet run --project src/ModelEvaluator.Cli --configuration Release --no-build -- validate --config config/evaluation.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-test-results
          path: artifacts/test-results
          retention-days: 14

  reference-evaluation:
    name: Reference evaluation (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - console-task-cli
          - class-library-pricing
          - webapi-task-minimal
          - worker-job-processor
          - blazor-task-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the harness
        run: dotnet build --configuration Release

      - name: Evaluate the reference implementations
        run: |
          dotnet run --project src/ModelEvaluator.Cli --configuration Release --no-build -- \
            evaluate --scenarios ${{ matrix.scenario }} --repetitions 1 --execution-image ubuntu-latest

      - name: Assert the known-good sample passes and the broken sample fails
        run: |
          results=$(ls -1t artifacts/evaluations/*/results.json | head -n 1)
          good=$(jq -r '[.attempts[] | select(.modelId == "reference-good") | .outcome] | unique | join(",")' "$results")
          broken=$(jq -r '[.attempts[] | select(.modelId == "reference-broken") | .outcome] | unique | join(",")' "$results")
          echo "reference-good: $good"
          echo "reference-broken: $broken"
          test "$good" = "Success"
          test "$broken" = "ModelFailure"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-evaluation-${{ matrix.scenario }}
          path: artifacts/evaluations/**
          retention-days: 14
          if-no-files-found: warn
